spring.application.name=Payment Event Recovery Engine

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

logging.level.root=INFO
logging.level.com.example.paymenteventrecoveryengine=DEBUG

app.retry.max-attempts=5
app.retry.initial-delay=1m
app.retry.multiplier=2
app.retry.max-delay=10m

# Mock Order Service
order-service.url=http://localhost:8081

logging.file.name=logs/payment-recovery.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n